# Monitra web client — static Vite build plus a same-origin /api/ proxy to
# the backend VM over the VPC's internal network.
# Installed at /etc/nginx/sites-available/monitra-app by setup_vm.sh, which
# substitutes __BACKEND_UPSTREAM__.
#
# Once the site has a DNS name, replace `server_name _;` with it and run
#   sudo certbot --nginx -d app.example.com

upstream monitra_backend {
    server __BACKEND_UPSTREAM__;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/monitra/current;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The build is made with VITE_API_BASE=/api/v1, so every API call is
    # same-origin and proxied here. No CORS configuration is involved.
    location /api/ {
        proxy_pass http://monitra_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames under /assets/; cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every other path serves index.html and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
