# Monitra API — reverse proxy to Uvicorn on 127.0.0.1:8000.
# Installed at /etc/nginx/sites-available/monitra-api by setup_vm.sh.
#
# Once the API has a DNS name, replace `server_name _;` with it and run
#   sudo certbot --nginx -d api.example.com
# certbot rewrites this file to add the 443 listener and the redirect.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Screenshot uploads are capped at 5 MB by the API; leave headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
