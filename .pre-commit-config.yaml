# Pre-commit hooks for Monitra.
#
#   pip install pre-commit && pre-commit install
#
# The architecture check is the important one: it catches a reintroduced
# thread-ownership violation before it reaches CI. See desktop/DO_NOT_DO.md.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: desktop-architecture
        name: desktop runtime ownership boundaries
        entry: python desktop/tools/check_architecture.py
        language: system
        pass_filenames: false
        files: ^desktop/.*\.py$

      - id: desktop-tests
        name: desktop regression suite
        entry: python -m pytest desktop/tests -q
        language: system
        pass_filenames: false
        files: ^desktop/.*\.py$
        stages: [pre-push]
